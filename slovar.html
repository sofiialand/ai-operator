<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Словарь терминов · AI-Оператор</title>
<meta name="description" content="Словарь AI-Оператора: названия нейросетей, английские слова, технические и бизнес-термины из уроков, гайдов и эфиров – простыми словами.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--cream:#f4efe7;--card:rgba(255,255,255,.72);--card-solid:#fbfaf7;--line:rgba(21,16,12,.09);--line-2:rgba(21,16,12,.16);--ink:#15100c;--ink-2:#0b0c0e;--text:#15100c;--text-mid:rgba(21,16,12,.68);--text-dim:rgba(21,16,12,.46);--gold:#fdd506;--gold-deep:#e6be00;--gold-rgb:253,213,6;--cool:#c2ccd2;--cool-rgb:194,204,210;--shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px rgba(21,16,12,.06);--sidebar-w:280px;--display:"Inter Tight","Inter",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:110px}
body{background:var(--bg);color:var(--text);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(760px 520px at 82% -6%,rgba(var(--gold-rgb),.16),transparent 70%),radial-gradient(820px 620px at 100% 100%,rgba(var(--cool-rgb),.55),transparent 70%),radial-gradient(640px 520px at 18% 70%,rgba(255,255,255,.7),transparent 70%)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hl{padding:0 .16em;border-radius:6px;background:var(--gold);color:var(--ink);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.layout{position:relative;z-index:1;min-height:100vh}
.main{margin-left:var(--sidebar-w);padding:48px 56px 72px}
.wrap{max-width:920px;margin:0 auto}

/* Меню слева */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);z-index:200;background:rgba(246,247,249,.78);border-right:1px solid var(--line);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);display:flex;flex-direction:column;padding:20px 12px;overflow-y:auto}
.sidebar-brand{padding:0 8px 20px;border-bottom:1px solid var(--line)}
.topnav{display:inline-flex;align-items:center;padding:3px;border-radius:12px;background:var(--ink-2);box-shadow:0 8px 20px rgba(21,16,12,.18);font-size:12px;font-weight:700;white-space:nowrap;color:var(--cream)}
.topnav-on{padding:6px 11px;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.topnav-beam{width:2px;height:18px;margin:0 8px;border-radius:2px;background:var(--gold)}
.topnav-off{padding:6px 11px 6px 0;color:rgba(244,239,231,.5)}
.sidebar-sub{margin-top:16px;font-size:12.5px;color:var(--text-mid)}
.nav-group{margin:20px 12px 10px;font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim)}
.letters{display:flex;flex-wrap:wrap;gap:2px 2px;padding:0 8px}
.letters a{min-width:26px;padding:3px 5px;border-radius:7px;color:var(--text-mid);font:600 15px/1.3 var(--display);text-align:center;text-decoration:none;transition:background .2s,color .2s}
.letters a:hover{color:var(--ink);background:rgba(var(--gold-rgb),.3)}
.letters a.is-active{color:var(--ink);background:var(--gold)}
.topics{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px;border-radius:12px;font-size:13.5px;font-weight:500;line-height:1.3;color:var(--text-mid);background:none;border:1px solid transparent;cursor:pointer;transition:background .2s,color .2s}
.nav-item:hover{background:rgba(255,255,255,.7);color:var(--text)}
.nav-item[aria-pressed=true]{background:var(--ink-2);color:var(--cream);box-shadow:0 8px 20px rgba(21,16,12,.16)}
.nav-num{min-width:30px;height:24px;padding:0 6px;flex:none;border-radius:999px;display:grid;place-items:center;font:500 10px var(--mono);color:var(--text-dim);background:rgba(255,255,255,.8);border:1px solid var(--line-2)}
.nav-item[aria-pressed=true] .nav-num{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
.sidebar-foot{margin-top:auto;padding:24px 8px 0;font:500 10.5px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.menu-btn{display:none;position:fixed;top:14px;left:16px;z-index:210;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--ink-2);color:var(--cream);border:0;box-shadow:0 8px 20px rgba(21,16,12,.2);font:600 13px var(--sans);cursor:pointer}
.menu-btn>span:first-child{display:block;width:14px;height:1.5px;background:currentColor;box-shadow:0 -4px 0 currentColor,0 4px 0 currentColor}
.overlay{display:none;position:fixed;inset:0;background:rgba(21,16,12,.35);z-index:190;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#lang{position:fixed;top:14px;right:16px;z-index:210;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#lang button{min-width:40px;min-height:30px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--text-mid);font:600 12px/1 var(--sans);cursor:pointer}
#lang button[aria-pressed="true"]{background:var(--ink-2);color:var(--cream)}

/* Шапка страницы */
.hero{padding:12px 0 32px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim)}
.eyebrow:before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.25)}
.hero-title{font:700 clamp(40px,6.2vw,68px)/1.02 var(--display);letter-spacing:-.03em;margin:16px 0 0;color:var(--ink)}
.hero-lead{margin-top:20px;max-width:640px;font-size:16px;color:var(--text-mid)}
.hero-lead b{color:var(--ink);font-weight:600}
.hero-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}
.fact{padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.fact-k{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.fact-v{margin-top:8px;font-size:14px;font-weight:500;line-height:1.5;color:var(--text-mid)}
.fact-v b{display:block;margin-bottom:4px;font:700 16px/1.3 var(--display);letter-spacing:-.01em;color:var(--ink)}

/* Поиск */
.searchbar{position:sticky;top:0;z-index:30;margin:0 -16px;padding:20px 16px 14px;background:rgba(238,241,244,.35);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.search{display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;border-radius:999px;background:#fff;border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(21,16,12,.08)}
.search:focus-within{border-color:var(--gold-deep);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.25)}
.search svg{width:20px;height:20px;flex:none;color:var(--text-dim)}
.search input{flex:1;min-width:0;height:54px;border:0;outline:0;background:none;font-size:16px}
.search input::placeholder{color:var(--text-dim)}
.search-clear{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink-2);color:var(--cream);font-size:14px;cursor:pointer}
.result-line{margin-top:10px;padding-left:18px;font:500 11.5px var(--mono);letter-spacing:.06em;color:var(--text-dim)}
.result-line button{border:0;background:none;margin-left:10px;color:var(--ink);font:inherit;text-decoration:underline;text-decoration-color:var(--gold-deep);text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer}

/* Буквы и термины */
.letter-block{margin-top:32px}
.letter-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.letter-head h2{display:grid;place-items:center;min-width:48px;height:48px;padding:0 10px;border-radius:14px;background:var(--ink-2);color:var(--gold);font:700 24px/1 var(--display)}
.letter-head span{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.entries{display:grid;gap:12px}
.entry{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding:18px 20px;border-radius:16px;background:var(--card-solid);border:1px solid var(--line)}
.entry.is-flash,.entry:target{border-color:rgba(var(--gold-rgb),.8);box-shadow:0 10px 30px rgba(var(--gold-rgb),.15)}
.term-name{font:700 17px/1.3 var(--display);letter-spacing:-.015em;color:var(--ink);overflow-wrap:anywhere}
.term-say{display:block;margin-top:8px;font:500 12px/1.45 var(--mono);color:var(--text-dim)}
.term-say b{font-weight:600;color:var(--text-mid)}
.term-def{font-size:14.5px;line-height:1.6;color:var(--text-mid)}
.term-heard{margin-top:10px;font-size:13px;line-height:1.5;color:var(--text-dim)}
.term-heard b{font-weight:500;color:var(--text-mid)}
.empty{margin-top:28px;padding:28px;border-radius:16px;background:var(--card-solid);border:1px solid var(--line);text-align:center;color:var(--text-mid)}
.empty b{display:block;margin-bottom:8px;font:700 18px/1.3 var(--display);color:var(--ink)}
mark{background:rgba(var(--gold-rgb),.6);color:inherit;border-radius:4px;padding:0 1px}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--text-dim)}
.foot a{color:var(--ink);font-weight:600;text-decoration-color:var(--gold-deep);text-decoration-thickness:2px;text-underline-offset:3px}
.to-top{position:fixed;right:20px;bottom:20px;z-index:150;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink-2);color:var(--gold);font-size:18px;box-shadow:0 10px 24px rgba(21,16,12,.2);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.to-top.is-on{opacity:1;pointer-events:auto}

@media (max-width:1100px){.main{padding:40px 32px 64px}.entry{grid-template-columns:190px minmax(0,1fr);gap:18px}}
@media (max-width:900px){.hero-facts{gap:8px}.fact{padding:12px 12px 14px}.fact-v{font-size:12.5px;line-height:1.45}.fact-v b{font-size:14px}}
@media (max-width:820px){.entry{grid-template-columns:150px minmax(0,1fr)}}
@media (max-width:640px){
  .hero-facts{grid-template-columns:minmax(0,1fr)}.fact{padding:14px 16px}.fact-v{font-size:13.5px}
  .sidebar{transform:translateX(-100%);transition:transform .25s ease;box-shadow:22px 0 56px rgba(21,16,12,.18);background:rgba(246,247,249,.97)}
  .sidebar.open{transform:none}
  .overlay.open{display:block}
  .menu-btn{display:inline-flex}
  .main{margin-left:0;padding:72px 16px 56px}
  .hero{padding-bottom:72px}
  .searchbar{top:0;padding-top:64px;margin-top:-52px}
  html{scroll-padding-top:150px}
  .entry{grid-template-columns:minmax(0,1fr);gap:8px;padding:16px}
  .to-top{right:14px;bottom:14px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{.sidebar,.menu-btn,#lang,.searchbar,.to-top,.overlay{display:none!important}.main{margin:0;padding:0}.entry{break-inside:avoid}}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="side">
    <div class="sidebar-brand">
      <span class="topnav"><span class="topnav-on">AI · Оператор</span><span class="topnav-beam"></span><span class="topnav-off" data-i18n="brandOff">Словарь</span></span>

      <div class="hero-facts">
        <div class="fact"><p class="fact-k">01</p><p class="fact-v" data-i18n-html="how1"></p></div>
        <div class="fact"><p class="fact-k">02</p><p class="fact-v" data-i18n-html="how2"></p></div>
        <div class="fact"><p class="fact-k">03</p><p class="fact-v" data-i18n-html="how3"></p></div>

    <div class="searchbar">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" autocomplete="off" spellcheck="false"><button class="search-clear" type="button" id="qClear" hidden>✕</button></label>
      <p class="result-line" id="resultLine"></p>

    <div id="list"></div>
    <p class="foot" data-i18n-html="footer"></p>
  </div></main>
</div>
<button class="to-top" id="toTop" type="button">↑</button>

<script>
const UI={
ru:{menu:'Меню',brandOff:'Словарь',eyebrow:'Справочник участника',
title:'Словарь <span class="hl">терминов</span>',
lead:'Слова, которые звучат на уроках, воркшопах и Q&amp;A AI-Оператора и встречаются в гайдах: названия нейросетей, английские слова, технические и бизнес-термины. <b>Каждое объяснено простыми словами – так, как его используют на курсе.</b>',
how1:'<b>Найдите слово</b>Начните печатать в поиске – хватит двух-трех букв. Можно искать и по-английски, и так, как слово звучит на слух: «клод», «промт».',
how2:'<b>Или откройте букву</b>Алфавит – в меню слева, на телефоне – под кнопкой «Меню». Сначала русские слова, потом названия латиницей.',
how3:'<b>Узнайте, как читается</b>У английских названий написано, как их произносят, чтобы узнать слово, когда спикер говорит его вслух.',
search:'Найти слово: например, промпт, Claude, прогрев',ru_letters:'Русские слова',lat_letters:'Латиница',topics:'Темы',all:'Все слова',
count:n=>n+' '+plural(n,['слово','слова','слов'])+' в словаре',found:n=>'Нашлось: '+n,reset:'Показать все',
say:'Читается:',heard:'В эфире звучит и так:',emptyT:'Такого слова в словаре пока нет',emptyD:'Проверьте написание или попробуйте английский вариант. Если слово звучало на уроке, а его здесь нет, напишите <a href="https://t.me/AIOperatoragent" target="_blank" rel="noopener">@AIOperatoragent</a> – добавим.',
footer:'Словарь собран по урокам, гайдам и записям эфиров AI-Оператора. Не нашли слово – напишите <a href="https://t.me/AIOperatoragent" target="_blank" rel="noopener">@AIOperatoragent</a>, добавим.',top:'Наверх',clear:'Очистить'},
uk:{menu:'Меню',brandOff:'Словник',eyebrow:'Довідник учасника',
title:'Словник <span class="hl">термінів</span>',
lead:'Слова, які звучать на уроках, воркшопах і Q&amp;A AI-Оператора та трапляються в гайдах: назви нейромереж, англійські слова, технічні й бізнес-терміни. <b>Кожне пояснене простими словами – так, як його використовують на курсі.</b>',
how1:'<b>Знайдіть слово</b>Почніть друкувати в пошуку – вистачить двох-трьох літер. Можна шукати і англійською, і так, як слово звучить на слух: «клод», «промт».',
how2:'<b>Або відкрийте літеру</b>Абетка – у меню ліворуч, на телефоні – під кнопкою «Меню». Спершу українські слова, потім назви латиницею.',
how3:'<b>Дізнайтеся, як читається</b>Біля англійських назв написано, як їх вимовляють, щоб упізнати слово, коли спікер каже його вголос.',
search:'Знайти слово: наприклад, промпт, Claude, прогрів',ru_letters:'Українські слова',lat_letters:'Латиниця',topics:'Теми',all:'Усі слова',

footer:'Словник зібраний за уроками, гайдами й записами ефірів AI-Оператора. Не знайшли слово – напишіть <a href="https://t.me/AIOperatoragent" target="_blank" rel="noopener">@AIOperatoragent</a>, додамо.',top:'Нагору',clear:'Очистити'}
};
const TOPICS={
ai:{ru:'Нейросети и сервисы',uk:'Нейромережі й сервіси'},
work:{ru:'Работа с нейросетями',uk:'Робота з нейромережами'},

course:{ru:'Слова курса',uk:'Слова курсу'}

:"Meta","s":"Мета","v":"Мета","d":"Компания, которой принадлежат Facebook, Instagram и WhatsApp. «Реклама в Мете» – реклама в Facebook и Instagram."},"uk":{"t":"Meta","s":"Мета","v":"Мета","d":"Компанія, якій належать Facebook, Instagram і WhatsApp. «Реклама в Меті» – реклама у Facebook та Instagram."}},{"c":"ai","ru":{"t":"Meta Ads","s":"Мета Эдс","v":"рекламный кабинет Меты","d":"Рекламная система Facebook и Instagram, где запускают платную рекламу и смотрят ее результаты."},"uk":{"t":"Meta Ads","s":"Мета Едс","v":"рекламний кабінет Мети","d":"Рекламна система Facebook і Instagram, де запускають платну рекламу і дивляться її результати."}},{"c":"ai","ru":{"t":"Threads","s":"Тредс","v":"Тредс","d":"Текстовая соцсеть от Instagram: короткие посты и обсуждения."},"uk":{"t":"Threads","s":"Тредс","v":"Тредс","d":"Текстова соцмережа від Instagram: короткі пости та обговорення."}},{"c":"ai","ru":{"t":"Zoom","s":"Зум","v":"Зум","d":"Программа для видеосозвонов. В ней проходят эфиры и Q&A курса, ссылка появляется в комьюнити перед началом."},"uk":{"t":"Zoom","s":"Зум","v":"Зум","d":"Програма для відеодзвінків. У ній проходять ефіри та Q&A курсу, посилання з'являється в ком'юніті перед початком."}},{"c":"ai","ru":{"t":"Telegram Desktop","s":"Телеграм Десктоп","v":"","d":"Приложение Telegram для компьютера. Из него выгружают переписку файлом, чтобы нейросеть ее разобрала."},"uk":{"t":"Telegram Desktop","s":"Телеграм Десктоп","v":"","d":"Застосунок Telegram для комп'ютера. З нього вивантажують листування файлом, щоб нейромережа його розібрала."}},{"c":"work","ru":{"t":"Нейросеть","s":"","v":"нейронка, ИИ, AI, искусственный интеллект","d":"Программа, которая понимает обычную речь и отвечает текстом, картинкой, кодом или голосом. Claude, ChatGPT, Gemini и Perplexity – нейросети."},"uk":{"t":"Нейромережа","s":"","v":"нейронка, ШІ, AI, штучний інтелект","d":"Програма, яка розуміє звичайне мовлення й відповідає текстом, картинкою, кодом або голосом. Claude, ChatGPT, Gemini і Perplexity – нейромережі."}},{"c":"work","ru":{"t":"AI","s":"Эй-Ай","v":"ИИ, ЭйАй","d":"Искусственный интеллект, по-английски artificial intelligence. В разговоре так называют нейросети в целом."},"uk":{"t":"AI","s":"Ей-Ай","v":"ШІ, ЕйАй","d":"Штучний інтелект, англійською artificial intelligence. У розмові так називають нейромережі загалом."}},{"c":"work","ru":{"t":"Модель","s":"","v":"мозги, версия модели","d":"Конкретная версия нейросети внутри одного сервиса: у Claude это Opus, Sonnet и Haiku. Свежие и старшие модели отвечают точнее, младшие – быстрее и дешевле."},"uk":{"t":"Модель","s":"","v":"мізки, версія моделі","d":"Конкретна версія нейромережі всередині одного сервісу: у Claude це Opus, Sonnet і Haiku. Свіжіші й старші моделі відповідають точніше, молодші – швидше і дешевше."}},{"c":"work","ru":{"t":"Промпт","s":"","v":"промт, промптик, запрос, prompt","d":"Текст запроса, который вы отправляете нейросети: что нужно получить, из каких материалов и в каком виде. Пишется обычными словами или надиктовывается голосом."},"uk":{"t":"Промпт","s":"","v":"промт, промптик, запит, prompt","d":"Текст запиту, який ви надсилаєте нейромережі: що потрібно отримати, з яких матеріалів і в якому вигляді. Пишеться звичайними словами або надиктовується голосом."}},{"c":"work","ru":{"t":"Промпт-инжиниринг","s":"","v":"промптинг, prompt engineering","d":"Умение составлять запросы к нейросети. Раньше это были длинные пошаговые инструкции, сейчас сильным моделям дают цель и условия, а порядок работы они выбирают сами."},"uk":{"t":"Промпт-інжиніринг","s":"","v":"промптинг, prompt engineering","d":"Вміння складати запити до нейромережі. Раніше це були довгі покрокові інструкції, тепер сильним моделям дають мету й умови, а порядок роботи вони обирають самі."}},{"c":"work","ru":{"t":"Системный промпт","s":"","v":"системная инструкция","d":"Постоянная инструкция, которая задает нейросети роль и правила на весь разговор или проект. Пишется один раз, повторять ее в каждом сообщении не нужно."},"uk":{"t":"Системний промпт","s":"","v":"системна інструкція","d":"Постійна інструкція, яка задає нейромережі роль і правила на всю розмову або проєкт. Пишеться один раз, повторювати її в кожному повідомленні не потрібно."}},{"c":"work","ru":{"t":"Метапромпт","s":"","v":"мета-промпт, метапромптинг","d":"Промпт, в котором вы просите нейросеть саму составить промпт. Вы описываете задачу, она задает уточняющие вопросы и собирает готовый текст запроса."},"uk":{"t":"Метапромпт","s":"","v":"мета-промпт, метапромптинг","d":"Промпт, у якому ви просите нейромережу саму скласти промпт. Ви описуєте завдання, вона ставить уточнювальні запитання й збирає готовий текст запиту."}},{"c":"work","ru":{"t":"Роль в промпте","s":"","v":"роль","d":"Указание, кем нейросети быть в этом ответе: «ты – юрист», «ты – строгий редактор». От роли зависит, на что она обратит внимание."},"uk":{"t":"Роль у промпті","s":"","v":"роль","d":"Вказівка, ким нейромережі бути в цій відповіді: «ти – юрист», «ти – суворий редактор». Від ролі залежить, на що вона зверне увагу."}},{"c":"work","ru":{"t":"Контекст","s":"","v":"context","d":"Все, что нейросеть видит в разговоре: ваши файлы, инструкции и всю переписку. Чем точнее контекст, тем точнее ответ."},"uk":{"t":"Контекст","s":"","v":"context","d":"Усе, що нейромережа бачить у розмові: ваші файли, інструкції та все листування. Чим точніший контекст, тим точніша відповідь."}},{"c":"work","ru":{"t":"Контекстное окно","s":"","v":"окно контекста","d":"Сколько текста нейросеть удерживает за один раз. Туда входит вся переписка целиком. Когда окно заполнено, ранние детали теряются или разговор сжимается."},"uk":{"t":"Контекстне вікно","s":"","v":"вікно контексту","d":"Скільки тексту нейромережа утримує за один раз. Туди входить усе листування повністю. Коли вікно заповнене, ранні деталі губляться або розмова стискається."}},{"c":"work","ru":{"t":"Токен","s":"","v":"токены","d":"Кусок текста примерно в 3-4 буквы – так нейросеть считает объем. Из токенов складывается расход лимита и цена работы через API."},"uk":{"t":"Токен","s":"","v":"токени","d":"Шматок тексту приблизно в 3-4 літери – так нейромережа рахує обсяг. З токенів складаються витрата ліміту й ціна роботи через API."}},{"c":"work","ru":{"t":"Лимит","s":"","v":"лимиты, недельный лимит, пятичасовой лимит","d":"Сколько работы доступно на вашей подписке за несколько часов или за неделю. Когда лимит исчерпан, нейросеть просит подождать или перейти на тариф выше."},"uk":{"t":"Ліміт","s":"","v":"ліміти, тижневий ліміт, п'ятигодинний ліміт","d":"Скільки роботи доступно на вашій підписці за кілька годин або за тиждень. Коли ліміт вичерпано, нейромережа просить зачекати або перейти на вищий тариф."}},{"c":"work","ru":{"t":"Подписка","s":"","v":"тариф, Pro, Plus, Max","d":"Ежемесячная оплата за нейросеть. Бесплатная версия ограничена, платные тарифы (Plus и Pro у ChatGPT, Pro и Max у Claude) дают больше лимитов и функций."},"uk":{"t":"Підписка","s":"","v":"тариф, Pro, Plus, Max","d":"Щомісячна оплата за нейромережу. Безкоштовна версія обмежена, платні тарифи (Plus і Pro у ChatGPT, Pro і Max у Claude) дають більше лімітів і функцій."}},{"c":"work","ru":{"t":"Кредиты","s":"","v":"кредиты генератора","d":"Внутренняя валюта сервиса. За каждый запрос или картинку списывается часть кредитов, когда они кончаются – докупаете."},"uk":{"t":"Кредити","s":"","v":"кредити генератора","d":"Внутрішня валюта сервісу. За кожен запит або картинку списується частина кредитів, коли вони закінчуються – докуповуєте."}},{"c":"work","ru":{"t":"Чат","s":"","v":"диалог, сессия, сеанс","d":"Один разговор с нейросетью. Новый чат начинается «с чистого листа»: прошлую переписку нейросеть не видит, если не включена память или проект."},"uk":{"t":"Чат","s":"","v":"діалог, сесія, сеанс","d":"Одна розмова з нейромережею. Новий чат починається «з чистого аркуша»: попереднє листування нейромережа не бачить, якщо не ввімкнена пам'ять або проєкт."}},{"c":"work","ru":{"t":"Сессия","s":"","v":"сеанс, новая сессия","d":"Один рабочий разговор с нейросетью или один сеанс работы в Claude Code, от начала до закрытия."},"uk":{"t":"Сесія","s":"","v":"сеанс, нова сесія","d":"Одна робоча розмова з нейромережею або один сеанс роботи в Claude Code, від початку до закриття."}},{"c":"work","ru":{"t":"Галлюцинации","s":"","v":"выдумки, галлюцинирует","d":"Уверенно поданная неправда: нейросеть придумывает факты, цифры, ссылки или цитаты, которых нет. Поэтому важные данные проверяют по источнику."},"uk":{"t":"Галюцинації","s":"","v":"вигадки, галюцинує","d":"Впевнено подана неправда: нейромережа вигадує факти, цифри, посилання чи цитати, яких немає. Тому важливі дані перевіряють за джерелом."}},{"c":"work","ru":{"t":"Instant","s":"Инстант","v":"инстант","d":"Самый быстрый режим: нейросеть отвечает сразу и почти не обдумывает задачу. Подходит для простых вопросов."},"uk":{"t":"Instant","s":"Інстант","v":"інстант","d":"Найшвидший режим: нейромережа відповідає одразу й майже не обмірковує завдання. Підходить для простих питань."}},{"c":"work","ru":{"t":"Deep Research","s":"Дип Ресерч","v":"дипресерч, глубокое исследование, DR","d":"Режим в ChatGPT, Claude, Gemini и Perplexity: нейросеть 10-40 минут сама обходит десятки сайтов и собирает отчет со ссылками."},"uk":{"t":"Deep Research","s":"Діп Рісерч","v":"діпрісерч, глибоке дослідження, DR","d":"Режим у ChatGPT, Claude, Gemini та Perplexity: нейромережа 10-40 хвилин сама обходить десятки сайтів і збирає звіт із посиланнями."}},{"c":"work","ru":{"t":"Research","s":"Ресерч","v":"режим Research","d":"Кнопка исследования в Claude: нейросеть сама ищет в интернете, открывает страницы и собирает отчет со ссылками."},"uk":{"t":"Research","s":"Рісерч","v":"режим Research","d":"Кнопка дослідження в Claude: нейромережа сама шукає в інтернеті, відкриває сторінки й збирає звіт із посиланнями."}},{"c":"work","ru":{"t":"Ресерч","s":"","v":"исследование, рисерч","d":"Исследование: собрать и разобрать, что уже известно и что работает у других по вашей теме."},"uk":{"t":"Ресерч","s":"","v":"дослідження, рісерч","d":"Дослідження: зібрати й розібрати, що вже відомо і що працює в інших за вашою темою."}},{"c":"work","ru":{"t":"Ассистент","s":"","v":"AI-ассистент, помощник","d":"Нейросеть, настроенная под одну рабочую задачу: с постоянной инструкцией и вашими материалами. Объяснять ей контекст заново в каждом чате не нужно."},"uk":{"t":"Асистент","s":"","v":"AI-асистент, помічник","d":"Нейромережа, налаштована під одне робоче завдання: зі сталою інструкцією та вашими матеріалами. Пояснювати їй контекст заново в кожному чаті не потрібно."}},{"c":"work","ru":{"t":"Агент","s":"","v":"AI-агент, ИИ-агент, агентик","d":"Нейросеть, которой вы ставите цель, а она сама решает, какие шаги сделать, какими инструментами воспользоваться и что проверить. Ассистент отвечает на запрос, агент выполняет задачу."},"uk":{"t":"Агент","s":"","v":"AI-агент, ШІ-агент, агентик","d":"Нейромережа, якій ви ставите мету, а вона сама вирішує, які кроки зробити, якими інструментами скористатися і що перевірити. Асистент відповідає на запит, агент виконує завдання."}},{"c":"work","ru":{"t":"AI-сотрудник","s":"","v":"цифровой сотрудник","d":"Агент, которому поручена постоянная работа в компании: отвечать клиентам, готовить отчеты, вести таблицы. Работает по инструкции и проверяется человеком."},"uk":{"t":"AI-співробітник","s":"","v":"цифровий співробітник","d":"Агент, якому доручено постійну роботу в компанії: відповідати клієнтам, готувати звіти, вести таблиці. Працює за інструкцією й перевіряється людиною."}},{"c":"work","ru":{"t":"Оркестрация","s":"","v":"оркестратор","d":"Управление несколькими агентами: кто какую часть делает, в каком порядке и как результаты сводятся вместе."},"uk":{"t":"Оркестрація","s":"","v":"оркестратор","d":"Керування кількома агентами: хто яку частину робить, у якому порядку і як результати зводяться докупи."}},{"c":"work","ru":{"t":"Инструмент","s":"","v":"tool, тулы","d":"Конкретное действие, доступное агенту: прочитать письмо, найти страницу, посчитать сумму, сохранить файл. Подключается отдельно."},"uk":{"t":"Інструмент","s":"","v":"tool, тули","d":"Конкретна дія, доступна агентові: прочитати лист, знайти сторінку, порахувати суму, зберегти файл. Підключається окремо."}},{"c":"work","ru":{"t":"Скил","s":"","v":"скилл, skill, навык, скиллы","d":"Файл с инструкцией для нейросети: как выполнять конкретную работу. Ставится один раз и дальше применяется по названию или сам, когда подходит задача."},"uk":{"t":"Скіл","s":"","v":"скіл, skill, навичка, скіли","d":"Файл з інструкцією для нейромережі: як виконувати конкретну роботу. Встановлюється один раз і далі застосовується за назвою або сам, коли підходить завдання."}},{"c":"work","ru":{"t":"SKILL.md","s":"Скил точка эм-дэ","v":"скил md","d":"Главный файл скила: в нем название, описание и сама инструкция для нейросети."},"uk":{"t":"SKILL.md","s":"Скіл крапка ем-ді","v":"скіл md","d":"Головний файл скіла: у ньому назва, опис і сама інструкція для нейромережі."}},{"c":"work","ru":{"t":"Skill Creator","s":"Скил Криэйтор","v":"скилл креатор","d":"Встроенный скил, который помогает создать новый скил: задает вам вопросы, собирает инструкцию и ставит ее в ваш аккаунт."},"uk":{"t":"Skill Creator","s":"Скіл Кріейтор","v":"скіл кріейтор","d":"Вбудований скіл, який допомагає створити новий скіл: ставить вам запитання, збирає інструкцію і встановлює її у ваш акаунт."}},{"c":"work","ru":{"t":"Плагин","s":"","v":"plugin, плагины","d":"Готовый набор под одну область работы: в нем сразу несколько скилов, коннекторов и команд. Ставится целиком."},"uk":{"t":"Плагін","s":"","v":"plugin, плагіни","d":"Готовий набір під одну сферу роботи: у ньому одразу кілька скілів, конекторів і команд. Встановлюється повністю."}},{"c":"work","ru":{"t":"Коннектор","s":"","v":"connector, подключение","d":"Подключение внешнего сервиса к Claude: почты, календаря, диска, CRM. После него нейросеть сама берет оттуда данные, без копирования вручную."},"uk":{"t":"Конектор","s":"","v":"connector, підключення","d":"Підключення зовнішнього сервісу до Claude: пошти, календаря, диска, CRM. Після нього нейромережа сама бере звідти дані, без копіювання вручну."}},{"c":"work","ru":{"t":"MCP","s":"Эм-Си-Пи","v":"MCP-коннектор, MCP-сервер","d":"Стандарт, по которому сервисы подключаются к нейросетям как коннекторы. «Поставить MCP» – подключить сервис к Claude."},"uk":{"t":"MCP","s":"Ем-Сі-Пі","v":"MCP-конектор, MCP-сервер","d":"Стандарт, за яким сервіси підключаються до нейромереж як конектори. «Поставити MCP» – підключити сервіс до Claude."}},{"c":"work","ru":{"t":"Память нейросети","s":"","v":"memory, постоянная память","d":"Настройка, при которой нейросеть запоминает факты о вас и ваших проектах между разными чатами."},"uk":{"t":"Пам'ять нейромережі","s":"","v":"memory, постійна пам'ять","d":"Налаштування, за якого нейромережа запам'ятовує факти про вас і ваші проєкти між різними чатами."}},{"c":"work","ru":{"t":"Проект в нейросети","s":"","v":"Projects, Spaces, Gems","d":"Отдельное рабочее место внутри нейросети: свои файлы и инструкция для одной задачи. Так устроены Projects в Claude и ChatGPT, Spaces в Perplexity, Gems в Gemini."},"uk":{"t":"Проєкт у нейромережі","s":"","v":"Projects, Spaces, Gems","d":"Окреме робоче місце всередині нейромережі: свої файли та інструкція для одного завдання. Так влаштовані Projects у Claude і ChatGPT, Spaces у Perplexity, Gems у Gemini."}},{"c":"work","ru":{"t":"База знаний","s":"","v":"knowledge base, внутренняя база знаний","d":"Собранные в одном месте документы компании или проекта: продукты, цены, правила, ответы на частые вопросы. Нейросеть отвечает по ним, а не по памяти."},"uk":{"t":"База знань","s":"","v":"knowledge base, внутрішня база знань","d":"Зібрані в одному місці документи компанії або проєкту: продукти, ціни, правила, відповіді на часті запитання. Нейромережа відповідає за ними, а не з пам'яті."}},{"c":"work","ru":{"t":"Второй мозг","s":"","v":"Second Brain, секонд брейн","d":"Личная база, куда нейросеть собирает вашу почту, заметки, файлы и записи встреч, чтобы видеть весь контекст и помогать принимать решения."},"uk":{"t":"Другий мозок","s":"","v":"Second Brain, секонд брейн","d":"Особиста база, куди нейромережа збирає вашу пошту, нотатки, файли та записи зустрічей, щоб бачити весь контекст і допомагати ухвалювати рішення."}},{"c":"work","ru":{"t":"Единое место правды","s":"","v":"единый источник, single source of truth","d":"Одно хранилище, где лежит действующая версия каждого правила и документа. Все, что лежит в чатах и на дисках отдельно, правилом не считается."},"uk":{"t":"Єдине місце правди","s":"","v":"єдине джерело, single source of truth","d":"Одне сховище, де лежить чинна версія кожного правила і документа. Усе, що лежить у чатах і на дисках окремо, правилом не вважається."}},{"c":"work","ru":{"t":"Разрешения","s":"","v":"permissions, пермишены","d":"Список того, что агенту можно и нельзя делать на вашем компьютере: какие файлы менять, какие команды запускать."},"uk":{"t":"Дозволи","s":"","v":"permissions, пермішени","d":"Список того, що агентові можна й не можна робити на вашому комп'ютері: які файли змінювати, які команди запускати."}},{"c":"work","ru":{"t":"Bypass Permissions","s":"Байпас пермишнс","v":"обход разрешений","d":"Режим Claude Code, в котором он выполняет все действия без вопросов. Включают только в песочнице, где ничего важного нельзя испортить."},"uk":{"t":"Bypass Permissions","s":"Байпас пермішнс","v":"обхід дозволів","d":"Режим Claude Code, у якому він виконує всі дії без запитань. Вмикають лише в пісочниці, де нічого важливого не можна зіпсувати."}},{"c":"work","ru":{"t":"Workflow","s":"Воркфлоу","v":"воркфлоу, рабочий процесс","d":"Цепочка шагов, по которой выполняется работа: что за чем идет и кто что делает – человек, агент или программа."},"uk":{"t":"Workflow","s":"Воркфлоу","v":"воркфлоу, робочий процес","d":"Ланцюжок кроків, за яким виконується робота: що за чим іде і хто що робить – людина, агент чи програма."}},{"c":"work","ru":{"t":"Расписание","s":"","v":"cron, крон, задача по расписанию","d":"Настройка, по которой агент запускается сам в заданное время, например каждое утро в 9:00, и присылает результат."},"uk":{"t":"Розклад","s":"","v":"cron, крон, завдання за розкладом","d":"Налаштування, за яким агент запускається сам у задану годину, наприклад щоранку о 9:00, і надсилає результат."}},{"c":"work","ru":{"t":"Хуманайзер","s":"","v":"Humanizer, хьюманайзер","d":"Скил или промпт, который убирает из текста обороты, по которым видно, что писала нейросеть."},"uk":{"t":"Хуманайзер","s":"","v":"Humanizer, х'юманайзер","d":"Скіл або промпт, який прибирає з тексту звороти, за якими видно, що писала нейромережа."}},{"c":"work","ru":{"t":"Тон оф войс","s":"","v":"tone of voice, ToV","d":"Манера речи человека или бренда: длина фраз, любимые слова, степень формальности. Нейросети дают образцы, чтобы она писала в этой манере."},"uk":{"t":"Тон оф войс","s":"","v":"tone of voice, ToV","d":"Манера мовлення людини чи бренду: довжина фраз, улюблені слова, ступінь формальності. Нейромережі дають зразки, щоб вона писала в цій манері."}},{"c":"work","ru":{"t":"Аватар","s":"","v":"цифровой двойник, AI-аватар","d":"Цифровая копия человека в видео: двигается и говорит вашим голосом текст, который вы ей дали."},"uk":{"t":"Аватар","s":"","v":"цифровий двійник, AI-аватар","d":"Цифрова копія людини у відео: рухається і говорить вашим голосом текст, який ви їй дали."}},{"c":"work","ru":{"t":"Транскрибация","s":"","v":"расшифровка, транскрипт","d":"Перевод записи речи в текст. Расшифровку эфира или звонка потом отдают нейросети для разбора."},"uk":{"t":"Транскрибація","s":"","v":"розшифровка, транскрипт","d":"Перетворення запису мовлення на текст. Розшифровку ефіру чи дзвінка потім віддають нейромережі для розбору."}},{"c":"work","ru":{"t":"Голосовой ввод","s":"","v":"диктовка","d":"Вместо набора на клавиатуре вы говорите, а программа печатает текст. На курсе для этого ставят Lispr, Wispr Flow или MacWhisper."},"u werShell. Команди для неї пише нейромережа, ви їх копіюєте."}},{"c":"tech","ru":{"t":"Папка проекта","s":"","v":"рабочая папка, директория","d":"Одна папка на компьютере, где лежат все файлы одного проекта. Claude Code работает внутри нее и видит только ее содержимое."},"uk":{"t":"Папка проєкту","s":"","v":"робоча папка, директорія","d":"Одна папка на комп'ютері, де лежать усі файли одного проєкту. Claude Code працює всередині неї й бачить лише її вміст."}},{"c":"tech","ru":{"t":"Файл","s":"","v":"","d":"Отдельный документ на компьютере. По окончанию названия (расширению) видно его тип: .pdf – документ, .jpg – фото, .md – текст для нейросети."},"uk":{"t":"Файл","s":"","v":"","d":"Окремий документ на комп'ютері. За закінченням назви (розширенням) видно його тип: .pdf – документ, .jpg – фото, .md – текст для нейромережі."}},{"c":"tech","ru":{"t":"Markdown","s":"Маркдаун","v":".md, md-файл","d":"Формат текстового файла, где заголовки и списки помечены простыми значками. Нейросети читают его без потерь, поэтому инструкции и базы знаний хранят в нем."},"uk":{"t":"Markdown","s":"Маркдаун","v":".md, md-файл","d":"Формат текстового файлу, де заголовки і списки позначені простими значками. Нейромережі читають його без втрат, тому інструкції та бази знань зберігають у ньому."}},{"c":"tech","ru":{"t":"PDF","s":"Пи-Ди-Эф","v":"ПДФ","d":"Формат документа, который одинаково выглядит на любом устройстве. Нейросети его читают, но таблицы и картинки из PDF иногда теряют."},"uk":{"t":"PDF","s":"Пі-Ді-Еф","v":"ПДФ","d":"Формат документа, який однаково виглядає на будь-якому пристрої. Нейромережі його читають, але таблиці й картинки з PDF іноді втрачають."}},{"c":"tech","ru":{"t":"DOCX","s":"Док-икс","v":"ворд","d":"Формат документа Word."},"uk":{"t":"DOCX","s":"Док-ікс","v":"ворд","d":"Формат документа Word."}},{"c":"tech","ru":{"t":"CSV","s":"Си-Эс-Ви","v":"csv-файл","d":"Простая таблица в виде текста: значения разделены запятыми. Такой файл открывается в Excel и Google Таблицах."},"uk":{"t":"CSV","s":"Сі-Ес-Ві","v":"csv-файл","d":"Проста таблиця у вигляді тексту: значення розділені комами. Такий файл відкривається в Excel і Google Таблицях."}},{"c":"tech","ru":{"t":"JSON","s":"Джейсон","v":"джейсон","d":"Формат файла, который удобно читать программе: данные разложены по полям. Например, выгрузка переписки из Telegram."},"uk":{"t":"JSON","s":"Джейсон","v":"джейсон","d":"Формат файлу, який зручно читати програмі: дані розкладені за полями. Наприклад, вивантаження листування з Telegram."}},{"c":"tech","ru":{"t":"ZIP-архив","s":"Зип","v":"зип, архив","d":"Сжатый файл, внутри которого лежат другие файлы. Так скачивают скилы с GitHub и загружают их в Claude целиком."},"uk":{"t":"ZIP-архів","s":"Зіп","v":"зіп, архів","d":"Стиснутий файл, усередині якого лежать інші файли. Так завантажують скіли з GitHub і вантажать їх у Claude цілком."}},{"c":"tech","ru":{"t":"README","s":"Ридми","v":"рид ми","d":"Файл с описанием проекта: что это, как установить и как пользоваться. Его первым читают человек и нейросеть."},"uk":{"t":"README","s":"Рідмі","v":"рід мі","d":"Файл з описом проєкту: що це, як установити й як користуватися. Його першим читають людина й нейромережа."}},{"c":"tech","ru":{"t":"Код","s":"","v":"программный код","d":"Текст на языке программирования, по которому работает сайт или программа. На курсе его пишет нейросеть, а вы описываете задачу словами."},"uk":{"t":"Код","s":"","v":"програмний код","d":"Текст мовою програмування, за яким працює сайт або програма. На курсі його пише нейромережа, а ви описуєте завдання словами."}},{"c":"tech","ru":{"t":"Скрипт","s":"","v":"скрипты","d":"Небольшая программа, которая выполняет действия по заданному порядку: переименовать файлы, собрать отчет. Ее можно попросить написать нейросеть."},"uk":{"t":"Скрипт","s":"","v":"скрипти","d":"Невелика програма, яка виконує дії за заданим порядком: перейменувати файли, зібрати звіт. Її можна попросити написати нейромережу."}},{"c":"tech","ru":{"t":"Вайб-кодинг","s":"", й сервис выдает в настройках. По нему ваша программа работает с сервисом от вашего имени. Ключ никому не пересылают и не выкладывают."},"uk":{"t":"API-ключ","s":"Ей-Пі-Ай ключ","v":"ключ доступу, токен доступу, API key","d":"Довгий секретний код, який сервіс видає в налаштуваннях. За ним ваша програма працює із сервісом від вашого імені. Ключ нікому не пересилають і не виставляють у відкритий доступ."}},{"c":"tech","ru":{"t":"Интеграция","s":"","v":"подключение, интегрировать","d":"Связь двух программ, чтобы они сами обменивались данными. Например, сайт сам отправляет заявки в CRM."},"uk":{"t":"Інтеграція","s":"","v":"підключення, інтегрувати","d":"Зв'язок двох програм, щоб вони самі обмінювалися даними. Наприклад, сайт сам надсилає заявки в CRM."}},{"c":"tech","ru":{"t":"База данных","s":"","v":"БД, база","d":"Хранилище, в котором программа сохраняет записи – клиентов, заявки, оплаты – и достает их, когда нужно."},"uk":{"t":"База даних","s":"","v":"БД, база","d":"Сховище, в якому програма зберігає записи – клієнтів, заявки, оплати – і дістає їх, коли потрібно."}},{"c":"tech","ru":{"t":"Сервер","s":"","v":"удаленный сервер, VPS","d":"Компьютер в дата-центре, который работает круглосуточно. Его арендуют, чтобы на нем жили сайт, бот или агент, даже когда ваш компьютер выключен."},"uk":{"t":"Сервер","s":"","v":"віддалений сервер, VPS","d":"Комп'ютер у дата-центрі, який працює цілодобово. Його орендують, щоб на ньому жили сайт, бот або агент, навіть коли ваш комп'ютер вимкнений."}},{"c":"tech","ru":{"t":"Telegram-бот","s":"","v":"бот, ТГ-бот, чат-бот","d":"Программа в Telegram, которая отвечает на сообщения и выполняет команды: принимает заявки, присылает отчеты, общается с клиентами."},"uk":{"t":"Telegram-бот","s":"","v":"бот, ТГ-бот, чат-бот","d":"Програма в Telegram, яка відповідає на повідомлення та виконує команди: приймає заявки, надсилає звіти, спілкується з клієнтами."}},{"c":"tech","ru":{"t":"Персональные данные","s":"","v":"персданные, личные данные","d":"Сведения, по которым можно узнать человека: имя, телефон, паспорт, адрес. Их нельзя загружать в нейросети без защиты и согласия."},"uk":{"t":"Персональні дані","s":"","v":"персданні, особисті дані","d":"Відомості, за якими можна впізнати людину: ім'я, телефон, паспорт, адреса. Їх не можна завантажувати в нейромережі без захисту й згоди."}},{"c":"tech","ru":{"t":"Парсинг","s":"","v":"парсер, скрапинг, скрейпер, спарсить","d":"Автоматический сбор данных со страниц сайтов или соцсетей в таблицу: посты, цены, комментарии."},"uk":{"t":"Парсинг","s":"","v":"парсер, скрапінг, скрейпер, спарсити","d":"Автоматичний збір даних зі сторінок сайтів або соцмереж у таблицю: пости, ціни, коментарі."}},{"c":"tech","ru":{"t":"Уведомления","s":"","v":"пуш-уведомления","d":"Сообщения от программы, которые всплывают на экране телефона или компьютера."},"uk":{"t":"Сповіщення","s":"","v":"пуш-сповіщення","d":"Повідомлення від програми, які спливають на екрані телефона чи комп'ютера."}},{"c":"biz","ru":{"t":"CRM","s":"Си-Ар-Эм","v":"СРМ, ЦРМ, сирмка","d":"Программа учета клиентов и сделок: кто обратился, на каком этапе, сколько заплатил, когда связаться снова."},"uk":{"t":"CRM","s":"Сі-Ар-Ем","v":"СРМ, ЦРМ, срмка","d":"Програма обліку клієнтів і угод: хто звернувся, на якому етапі, скільки заплатив, коли зв'язатися знову."}},{"c":"biz","ru":{"t":"Дашборд","s":"","v":"dashboard, панель","d":"Одна страница с главными цифрами бизнеса в виде графиков и таблиц: продажи, заявки, расходы. Обновляется сама."},"uk":{"t":"Дашборд","s":"","v":"dashboard, панель","d":"Одна сторінка з головними цифрами бізнесу у вигляді графіків і таблиць: продажі, заявки, витрати. Оновлюється сама."}},{"c":"biz","ru":{"t":"Выручка","s":"","v":"оборот","d":"Все деньги, которые пришли от клиентов, до вычета расходов."},"uk":{"t":"Виручка","s":"","v":"оборот","d":"Усі гроші, які надійшли від клієнтів, до вирахування витрат."}},{"c":"biz","ru":{"t":"Маржа","s":"","v":"маржинальность","d":"Разница между ценой продажи и затрата <script>
(function(){
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const qp=new URLSearchParams(location.search).get('lang');
let lang=qp==='uk'||qp==='ru'?qp:(store('op-lang')==='uk'?'uk':'ru');
let topic='';
const $=s=>document.querySelector(s);
const list=$('#list'),q=$('#q'),side=$('#side'),ov=$('#ov');
const isLat=s=>/^[A-Za-z0-9#.]/.test(s);
const norm=s=>(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"'’`]/g,'');
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function hl(s,needle){const e=esc(s);if(!needle)return e;const i=norm(e).indexOf(needle);if(i<0)return e;return e.slice(0,i)+'<mark>'+e.slice(i,i+needle.length)+'</mark>'+e.slice(i+needle.length)}
function firstLetter(t){const c=t.trim()[0].toUpperCase();return /[0-9#.]/.test(c)?'#':c}
function entries(){
  return TERMS.map((x,i)=>({i,c:x.c,...x[lang]})).filter(x=>x.t).sort((a,b)=>{
    const la=isLat(a.t),lb=isLat(b.t);if(la!==lb)return la?1:-1;
    return a.t.localeCompare(b.t,la?'en':lang,{sensitivity:'base'})});
}
function alphabet(){return lang==='uk'?'АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЮЯ'.split(''):'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЭЮЯ'.split('')}
const LAT='#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const slug=l=>'l-'+(l==='#'?'num':l);
function nav(){
  const all=entries(),have=new Set(all.map(e=>firstLetter(e.t))),L=UI[lang];
  const letters=arr=>'<div class="letters">'+arr.filter(l=>have.has(l)).map(l=>`<a href="#${slug(l)}" data-letter="${l}">${l==='#'?'0–9':l}</a>`).join('')+'</div>';
  const tps='<div class="topics"><button type="button" class="nav-item" data-topic="" aria-pressed="'+(!topic)+'"><span class="nav-num">'+all.length+'</span>'+L.all+'</button>'+Object.keys(TOPICS).map(k=>`<button type="button" class="nav-item" data-topic="${k}" aria-pressed="${topic===k}"><span class="nav-num">${all.filter(e=>e.c===k).length}</span>${TOPICS[k][lang]}</button>`).join('')+'</div>';
  $('#sideNav').innerHTML=`<p class="nav-group">${L.ru_letters}</p>${letters(alphabet())}<p class="nav-group">${L.lat_letters}</p>${letters(LAT)}<p class="nav-group">${L.topics}</p>${tps}`;
  $('#sideNav').querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;nav();render();closeMenu();const sb=$('.searchbar');window.scrollTo({top:sb.getBoundingClientRect().top+scrollY-8,behavior:'smooth'})});
  $('#sideNav').querySelectorAll('.letters a').forEach(a=>a.onclick=ev=>{if(q.value||topic){q.value='';topic='';nav();render()}closeMenu();const t=document.getElementById(slug(a.dataset.letter));if(t){ev.preventDefault();t.scrollIntoView({behavior:'smooth'});try{history.replaceState(null,'','#'+t.id)}catch(e){}}});
}
function render(){
  const L=UI[lang],needle=norm(q.value.trim());
  let all=entries();const total=all.length;
  if(topic)all=all.filter(e=>e.c===topic);
  const head=e=>norm(e.t+' '+(e.s||'')+' '+(e.v||''));
  if(needle){all=all.filter(e=>head(e).includes(needle)||norm(e.d).includes(needle));const rk=e=>norm(e.t).startsWith(needle)?0:norm(e.t).includes(needle)?1:head(e).includes(needle)?2:3;all.sort((a,b)=>rk(a)-rk(b))}
  const groups=[];let cur=null;
  if(needle)groups.push({l:'',items:all});else for(const e of all){const l=firstLetter(e.t);if(!cur||cur.l!==l){cur={l,items:[]};groups.push(cur)}cur.items.push(e)}
  list.innerHTML=groups.filter(g=>g.items.length).map(g=>`<section class="letter-block"${g.l?` id="${slug(g.l)}"`:''}>${g.l?`<div class="letter-head"><h2>${g.l==='#'?'0–9':g.l}</h2><span>${g.items.length}</span></div>`:''}<div class="entries">${g.items.map(e=>`<article class="entry" id="t${e.i}"><div><h3 class="term-name">${hl(e.t,needle)}</h3>${e.s?`<span class="term-say"><b>${L.say}</b> ${esc(e.s)}</span>`:''}</div><div><p class="term-def">${hl(e.d,needle)}</p>${e.v?`<p class="term-heard"><b>${L.heard}</b> ${hl(e.v,needle)}</p>`:''}</div></article>`).join('')}</div></section>`).join('')||`<div class="empty"><b>${L.emptyT}</b>${L.emptyD}</div>`;
  $('#resultLine').innerHTML=(needle||topic)?L.found(all.length)+` <button type="button" id="resetBtn">${L.reset}</button>`:L.count(total);
  $('#sideCount').textContent=L.count(total);
  $('#qClear').hidden=!q.value;
  const rb=$('#resetBtn');if(rb)rb.onclick=()=>{q.value='';topic='';nav();render()};
  nbsp(list);onScroll();
}
function setLang(l,keep){
  lang=l;const L=UI[lang];document.documentElement.lang=l;
  document.title=l==='uk'?'Словник термінів · AI-Оператор':'Словарь терминов · AI-Оператор';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=L[el.dataset.i18n]);
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=L[el.dataset.i18nHtml]);
  q.placeholder=L.search;$('#qClear').setAttribute('aria-label',L.clear);$('#toTop').setAttribute('aria-label',L.top);
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));
  if(keep){store('op-lang',l);try{const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u)}catch(e){}}
  nav();render();nbsp(document.querySelector('.hero'));nbsp(document.querySelector('.foot'));
}
function closeMenu(){side.classList.remove('open');ov.classList.remove('open')}
$('#menu').onclick=()=>{side.classList.add('open');ov.classList.add('open')};ov.onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang,true));
let tmr;q.addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(render,120)});
$('#qClear').onclick=()=>{q.value='';render();q.focus()};
const toTop=$('#toTop');toTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
function onScroll(){toTop.classList.toggle('is-on',scrollY>900);let c='';document.querySelectorAll('.letter-block[id]').forEach(s=>{if(s.getBoundingClientRect().top<180)c=s.id});document.querySelectorAll('#sideNav .letters a').forEach(a=>a.classList.toggle('is-active',slug(a.dataset.letter)===c))}
addEventListener('scroll',onScroll,{passive:true});
const SHORT=/(^|[\s(«])(в|во|с|со|и|к|ко|у|а|о|об|на|по|за|до|от|из|не|ни|для|без|при|про|над|под|что|как|но|же|ли|й|та|чи|з|із|від|це|і|й)\s+/gi;
function nbsp(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){let t=n.nodeValue;const o=t;t=t.replace(SHORT,(m,p,word)=>p+word+' ').replace(SHORT,(m,p,word)=>p+word+' ').replace(/(\d)[ ](?=\d{3}\b)/g,'$1 ').replace(/(\d)\s(\$|%|×)/g,'$1 $2').replace(/\s–\s/g,' – ');if(t!==o)n.nodeValue=t}}
setLang(lang,false);
if(location.hash){const t=document.querySelector(location.hash);if(t)setTimeout(()=>t.scrollIntoView(),60)}
