<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Материалы вводного урока</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0c0e;--cream:#f4efe7;--gold:#fdd506}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
html[lang="uk"] .ru,html[lang="ru"] .uk{display:none}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:8px 16px 28px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 10px 10px 24px;border-radius:999px;background:var(--ink);color:var(--cream);font:700 15px/1.2 Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 16px rgba(21,16,12,.18);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 16px rgba(21,16,12,.24)}
.btn:first-child{background:var(--gold);color:var(--ink)}
.btn:first-child i{background:var(--ink);color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn i{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:17px;font-style:normal}
@media (max-width:420px){
  .btn{padding-left:16px;font-size:13px}
  .btn i{width:30px;height:30px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<nav class="links">
  <a class="btn" href="https://sofiialand.github.io/ai-operator/onboarding.html" target="_blank" rel="noopener"><span><span class="uk">Презентація</span><span class="ru">Презентация</span></span><i aria-hidden="true">→</i></a>
  <a class="btn" href="https://transkript-vvodniu-ai-operator.vercel.app" target="_blank" rel="noopener"><span><span class="uk">Транскрибація</span><span class="ru">Транскрибация</span></span><i aria-hidden="true">→</i></a>
</nav>
<script>
if(new URLSearchParams(location.search).get('lang')==='uk')document.documentElement.lang='uk';
</script>
<script>
/* Сообщает платформе высоту содержимого, чтобы фрейм был без пустого места и обрезки */
(function(){
  if(window.parent===window)return;
  var box=document.querySelector('.links'),last=0;
  function send(){
    var h=Math.ceil(box.getBoundingClientRect().height);
    if(h&&h!==last){last=h;window.parent.postMessage({kovchegHeight:h},'*');}
  }
  send();
  addEventListener('load',send);
  addEventListener('resize',send);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(send);
  if(window.ResizeObserver)new ResizeObserver(send).observe(box);
})();
</script>
</body>
</html>
