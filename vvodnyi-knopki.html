<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Матеріали вступного уроку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0c0e;--cream:#f4efe7;--gold:#fdd506}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
html[lang="uk"] .ru,html[lang="ru"] .uk{display:none}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;padding:26px 16px 44px 32px;isolation:isolate}
.btn{--glow:.85;position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:76px;padding:0 30px 0 34px;border-radius:999px;background:linear-gradient(180deg,#fafafc 0%,#f0f0f4 100%);color:#17181c;font:500 19px/1.2 Inter,system-ui,sans-serif;letter-spacing:-.01em;text-decoration:none;box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(60,64,84,.05),-5px 6px 10px rgba(60,64,84,.14),-16px 20px 26px rgba(60,64,84,.2);transition:transform .45s cubic-bezier(.32,.72,0,1),box-shadow .45s cubic-bezier(.32,.72,0,1)}
.btn:before,.btn:after{content:"";position:absolute;left:50%;z-index:-1;transform:translateX(-50%);border-radius:50%;pointer-events:none;opacity:var(--glow);transition:opacity .45s cubic-bezier(.32,.72,0,1)}
.btn:before{top:-24px;width:46%;height:48px;background:radial-gradient(closest-side,rgba(255,190,120,.6),rgba(255,190,120,0))}
.btn:after{bottom:-30px;width:60%;height:60px;background:radial-gradient(closest-side,rgba(255,150,64,.9),rgba(255,176,96,.4) 45%,rgba(255,176,96,0))}
.btn span.edge{position:absolute;left:50%;bottom:-1px;width:30%;height:2px;transform:translateX(-50%);border-radius:2px;background:linear-gradient(90deg,rgba(255,196,110,0),#ffd9a0 50%,rgba(255,196,110,0));opacity:var(--glow);pointer-events:none}
.btn svg{flex:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s cubic-bezier(.32,.72,0,1)}
.btn:hover{--glow:1;transform:translateY(-2px)}
.btn:hover svg{transform:translateX(4px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:focus-visible{outline:2px solid #17181c;outline-offset:3px}
@media (max-width:560px){
  .links{gap:24px;padding:20px 8px 34px 18px}
  .btn{min-height:60px;padding:0 16px 0 18px;font-size:14px;box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(60,64,84,.05),-3px 4px 7px rgba(60,64,84,.14),-9px 12px 16px rgba(60,64,84,.2)}
  .btn svg{width:18px;height:18px}
}
@media (prefers-reduced-motion:reduce){.btn,.btn svg,.btn:before,.btn:after{transition:none}}
</style>
</head>
<body>
<nav class="links">
  <a class="btn" href="https://sofiialand.github.io/ai-operator/onboarding.html" target="_blank" rel="noopener"><span><span class="uk">Презентація</span><span class="ru">Презентация</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg><span class="edge"></span></a>
  <a class="btn" href="https://transkript-vvodniu-ai-operator.vercel.app" target="_blank" rel="noopener"><span><span class="uk">Транскрибація</span><span class="ru">Транскрибация</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg><span class="edge"></span></a>
</nav>
<script>
if(new URLSearchParams(location.search).get('lang')==='ru')document.documentElement.lang='ru';
</script>
<script>
/* Сообщает платформе высоту содержимого, чтобы фрейм был без пустого места и обрезки */
(function(){
  if(window.parent===window)return;
  var box=document.querySelector('.links'),last=0;
  function send(){
    var h=Math.ceil(box.getBoundingClientRect().height);
    if(h&&h!==last){last=h;window.parent.postMessage({kovchegHeight:h},'*');}
  }
  send();
  addEventListener('load',send);
  addEventListener('resize',send);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(send);
  if(window.ResizeObserver)new ResizeObserver(send).observe(box);
})();
</script>
</body>
</html>
