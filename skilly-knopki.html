<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Материалы воркшопа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Inter+Tight:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0c0e;--ink-2:#15100c;--cream:#f4efe7;--gold:#fdd506}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
html[lang="uk"] .ru,html[lang="ru"] .uk{display:none}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:8px 16px 28px}
h1{grid-column:1/-1;margin-bottom:8px;color:var(--ink-2);font:700 clamp(28px,3.6vw,44px)/1.05 "Inter Tight",Inter,system-ui,sans-serif;letter-spacing:-.03em}
.btn{display:flex;align-items:center;gap:14px;min-height:92px;padding:14px 16px;border-radius:18px;font-family:Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 16px rgba(21,16,12,.18);transition:transform .2s,box-shadow .2s}
a.btn[href]:hover{transform:translateY(-1px);box-shadow:0 10px 16px rgba(21,16,12,.24)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn svg{flex:none;width:44px;height:44px;padding:11px;border-radius:12px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn b{display:block;font-weight:700;font-size:15px;line-height:1.25}
.btn small{display:block;margin-top:4px;font-weight:500;font-size:12.5px;line-height:1.35}
.gold{background:var(--gold);color:var(--ink-2)}
.gold svg{background:var(--ink-2);color:var(--gold)}
.gold small{color:#4a3d05}
.ink{background:var(--ink);color:var(--cream)}
.ink svg{background:var(--gold);color:var(--ink-2)}
.ink small{color:#b9b3a9}
.cream{background:var(--cream);color:var(--ink-2)}
.cream svg{background:var(--ink-2);color:var(--gold)}
.cream small{color:#5f5a52}
.white{background:#fff;color:var(--ink-2);box-shadow:inset 0 0 0 1px rgba(21,16,12,.16),0 8px 16px rgba(21,16,12,.1)}
.white svg{background:var(--ink-2);color:var(--gold)}
.white small{color:#5f5a52}
.wide{grid-column:1/-1}
.new{display:inline-block;margin-left:4px;padding:2px 7px;border-radius:999px;background:var(--gold);color:var(--ink-2);font-style:normal;font-weight:700;font-size:10.5px;line-height:1.3;letter-spacing:.06em;vertical-align:1.5px}
@media (max-width:560px){
  .links{grid-template-columns:minmax(0,1fr)}
  .btn{min-height:76px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<section class="links">
  <h1><span class="uk">Матеріали воркшопу</span><span class="ru">Материалы воркшопа</span></h1>
  <a class="btn gold" href="https://sofiialand.github.io/ai-operator/skilly-gajd.html" data-local="Гайд Скиллы.html" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/><path d="M9 8h6"/></svg>
    <span><b><span class="uk">Гайд із воркшопу</span><span class="ru">Гайд по воркшопу</span></b><small><span class="uk">Покроковий конспект усього воркшопу</span><span class="ru">Пошаговый конспект всего воркшопа</span></small></span>
  </a>
  <a class="btn ink" href="https://skills-navigator-five.vercel.app/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
    <span><b><span class="uk">База всіх скілів</span><span class="ru">База всех скиллов</span>&nbsp;<i class="new">NEW</i></b><small><span class="uk">Навігатор скілів Влада</span><span class="ru">Навигатор скиллов Влада</span></small></span>
  </a>
  <a class="btn white wide" href="https://sofiialand.github.io/ai-operator/skilly-transkript.html" data-local="Транскрибация Скиллы.html" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
    <span><b><span class="uk">Транскрибація</span><span class="ru">Транскрибация</span></b><small><span class="uk">Текст відео</span><span class="ru">Текст видео</span></small></span>
  </a>
</section>
<script>
if(new URLSearchParams(location.search).get('lang')==='uk'){document.documentElement.lang='uk';document.title='Матеріали воркшопу';}
/* На компьютере кнопки открывают файлы из этой же папки */
if(location.protocol==='file:')document.querySelectorAll('[data-local]').forEach(function(a){a.href=encodeURI(a.dataset.local);});
/* Украинская версия кнопок ведет в украинскую версию гайда */
if(document.documentElement.lang==='uk'){var g=document.querySelector('.gold');g.href+='?lang=uk';}
</script>
<script>
/* Сообщает платформе высоту содержимого, чтобы фрейм был без пустого места и обрезки */
(function(){
  if(window.parent===window)return;
  var box=document.querySelector('.links'),last=0;
  function send(){
    var h=Math.ceil(box.getBoundingClientRect().height);
    if(h&&h!==last){last=h;window.parent.postMessage({kovchegHeight:h},'*');}
  }
  send();
  addEventListener('load',send);
  addEventListener('resize',send);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(send);
  if(window.ResizeObserver)new ResizeObserver(send).observe(box);
})();
</script>
</body>
</html>
